<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাজুস - স্বর্ণ ও রৌপ্যের দাম</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-container">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
        <div class="gradient-mesh"></div>
    </div>

    <div class="page-wrapper">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="brand">
                        <div class="brand-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </div>
                        <div class="brand-text">
                            <h1>বাজুস প্রাইস ট্র্যাকার</h1>
                            <p>বাংলাদেশ জুয়েলার্স সমিতি</p>
                        </div>
                    </div>
                    <div class="header-right">
                        <div class="date-display" id="date-display"></div>
                        <div class="time-display" id="time-display"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <div class="page-header">
                    <h2 class="page-title">আজকের বাজার দর</h2>
                    <p class="page-subtitle">প্রতি গ্রাম অনুযায়ী হালনাগাদ মূল্য</p>
                </div>

                <div id="prices-container">
                    <div class="loading-state">
                        <div class="loader"></div>
                        <p>দাম লোড হচ্ছে...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>© ২০২৫ বাজুস প্রাইস ট্র্যাকার | সকল তথ্য বাংলাদেশ জুয়েলার্স সমিতি থেকে সংগৃহীত</p>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
